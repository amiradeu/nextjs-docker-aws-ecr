name: Build and Push Docker Image to AWS ECR

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required to checkout code

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # automatically generates Docker image tags and labels based on GitHub context 
      # like branch name, PR, or commit SHA
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}
          tags: |
            # 1. PR builds (e.g. pr-42-5a2ab27)
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ github.sha }},enable=${{ github.event_name == 'pull_request' }}

            # 2. Branch builds (e.g. main-5a2ab27)
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=${{ github.event_name != 'pull_request' }}

            # 3. Latest tag for default branch only (e.g. main-latest)
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.ref_name == github.event.repository.default_branch }}

            # 4. simple SHA tag (for debugging or deterministic pull)
            type=sha

      - name: Build and push Docker image
        run: |
          # Get the base image name (registry/repository)
          IMAGE_NAME="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}"
          
          # Build Docker image with first tag
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker build -t "$FIRST_TAG" .

          # Tag and push all additional tags
          while IFS= read -r TAG; do
            if [ -n "$TAG" ] && [ "$TAG" != "$FIRST_TAG" ]; then
              docker tag "$FIRST_TAG" "$TAG"
            fi
            docker push "$TAG"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Output image details
        run: |
          echo "Image pushed successfully!"
          echo "Repository: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"